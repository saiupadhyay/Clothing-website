[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://blackfits.onrender.com/api"

# Single-Page Application (SPA) routing: redirect all traffic to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
